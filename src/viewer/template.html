<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ccusage Archive</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #16162a;
      --surface-hover: #1c1c36;
      --text: #d8d8e8;
      --text-secondary: #8888a0;
      --muted: #555568;
      --border: #222240;
      --accent: #4a6fa5;
      --accent-hover: #5a82bd;
      --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f4f8;
        --surface: #ffffff;
        --surface-hover: #f0f0f6;
        --text: #1a1a2e;
        --text-secondary: #666680;
        --muted: #999aab;
        --border: #e0e0ec;
        --accent: #3a5f95;
        --accent-hover: #2d4f7d;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }

    header { margin-bottom: 2.5rem; }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-family: var(--mono);
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .stat {
      background: var(--surface);
      padding: 1.25rem 1rem;
    }

    .stat-value {
      font-family: var(--mono);
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.3rem;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1.5rem;
    }

    .toggle {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      overflow: hidden;
    }

    .toggle button {
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      letter-spacing: 0.02em;
    }

    .toggle button:hover { color: var(--text-secondary); }

    .toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    /* Charts */
    .chart-section {
      margin-bottom: 2rem;
    }

    .chart-section h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      position: relative;
      height: 220px;
    }

    /* Table */
    .table-section { margin-top: 0.5rem; }

    .table-section h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    th.num, td.num { text-align: right; }

    td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    td.num {
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    td.period-cell {
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    tr.period-row { cursor: pointer; transition: background 0.1s; }
    tr.period-row:hover { background: var(--surface-hover); }

    .chevron {
      display: inline-block;
      width: 0.9em;
      text-align: center;
      color: var(--muted);
      transition: transform 0.15s ease;
      font-size: 0.6rem;
      margin-right: 0.25rem;
    }

    .chevron.open { transform: rotate(90deg); }

    tr.detail-row { display: none; }
    tr.detail-row.open { display: table-row; }

    tr.detail-row td {
      padding: 0.3rem 0.75rem 0.3rem 2.25rem;
      color: var(--text-secondary);
      font-size: 0.78rem;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
    }

    tr.totals-row td {
      border-top: 2px solid var(--border);
      font-weight: 600;
      padding-top: 0.7rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 5rem 1rem;
      font-size: 0.95rem;
    }

    .empty-state code {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.15em 0.45em;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 0.85em;
    }

    @media (max-width: 640px) {
      .container { padding: 2rem 1rem 3rem; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 1.1rem; }
      .chart-wrap { height: 180px; padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ccusage Archive</h1>
      <p class="subtitle" id="subtitle"></p>
    </header>

    <div class="controls" style="justify-content:flex-start;margin-bottom:1.25rem">
      <div class="toggle" id="mainTabs">
        <button type="button" class="active" data-tab="usage">Usage</button>
        <button type="button" data-tab="sessions">Sessions</button>
      </div>
    </div>

    <div id="usagePanel">
    <div class="stats" id="stats"></div>

    <div class="controls">
      <div class="toggle" id="granularity">
        <button type="button" data-view="daily">Daily</button>
        <button type="button" data-view="weekly">Weekly</button>
        <button type="button" class="active" data-view="monthly">Monthly</button>
      </div>
    </div>

    <div class="chart-section">
      <h2>Cost</h2>
      <div class="chart-wrap"><canvas id="costChart"></canvas></div>
    </div>

    <div class="chart-section">
      <h2>Tokens</h2>
      <div class="chart-wrap"><canvas id="tokenChart"></canvas></div>
    </div>

    <div class="chart-section">
      <h2>Models</h2>
      <div class="chart-wrap"><canvas id="modelChart"></canvas></div>
    </div>

    <div class="table-section" id="tableSection">
      <h2>Detail</h2>
      <div id="tableContainer"></div>
    </div>

    <div class="empty-state" id="emptyState" style="display:none">
      No data yet. Run <code>npm start</code> to capture usage.
    </div>
    </div><!-- /usagePanel -->

    <div id="sessionsPanel" style="display:none">
      <p class="subtitle" id="sessionSubtitle" style="margin-bottom:1.5rem"></p>
      <div class="stats" id="sessionStats"></div>
      <div class="chart-section">
        <h2>Session start times &middot; local hour</h2>
        <div class="chart-wrap"><canvas id="startHourChart"></canvas></div>
      </div>
      <div class="chart-section">
        <h2>Tokens per session &middot; vs peak</h2>
        <div class="chart-wrap"><canvas id="blockTokenChart"></canvas></div>
      </div>
      <div class="chart-section">
        <h2>Burn rate &middot; tokens per min</h2>
        <div class="chart-wrap"><canvas id="burnChart"></canvas></div>
      </div>
      <div class="table-section">
        <h2>Recent sessions</h2>
        <div id="sessionTableContainer"></div>
      </div>
      <div class="empty-state" id="sessionEmpty" style="display:none">
        No session data yet. Run <code>npm start</code> to capture blocks.
      </div>
    </div>
  </div>

  <script>/*__CHARTJS__*/</script>
  <script>
    const DATA = [/*__DATA__*/];
    const BLOCKS = [/*__BLOCKS__*/];
    const WEEKS = [/*__WEEKS__*/];

    const MODEL_COLORS = [
      '#4a6fa5', '#6a8fc5', '#3d5a80', '#8ab0d6', '#2c4a6e',
      '#5c7ea0', '#7da3c8', '#4e7a9e', '#9bc0e0', '#3a6890'
    ];

    function clearElement(el) {
      while (el.firstChild) el.removeChild(el.firstChild);
    }

    function _formatCost(n) {
      if (n >= 1000) return `$${n.toFixed(0)}`;
      if (n >= 100) return `$${n.toFixed(1)}`;
      return `$${n.toFixed(2)}`;
    }

    function formatTokens(n) {
      if (n >= 1e9) return `${(n / 1e9).toFixed(1)}B`;
      if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`;
      if (n >= 1e3) return `${(n / 1e3).toFixed(1)}K`;
      return String(n);
    }

    function formatCostTooltip(n) {
      return `$${n.toFixed(2)}`;
    }

    // Aggregation
    function getISOWeek(dateStr) {
      const d = new Date(`${dateStr}T00:00:00`);
      const day = d.getDay() || 7;
      d.setDate(d.getDate() + 4 - day);
      const yearStart = new Date(d.getFullYear(), 0, 1);
      const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
      return `${d.getFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function mergeModels(allModels) {
      const byModel = {};
      for (const m of allModels) {
        if (!byModel[m.model]) {
          byModel[m.model] = { model: m.model, inputTokens: 0, outputTokens: 0, cacheCreationTokens: 0, cacheReadTokens: 0, cost: 0 };
        }
        byModel[m.model].inputTokens += m.inputTokens;
        byModel[m.model].outputTokens += m.outputTokens;
        byModel[m.model].cacheCreationTokens += m.cacheCreationTokens;
        byModel[m.model].cacheReadTokens += m.cacheReadTokens;
        byModel[m.model].cost += m.cost;
      }
      return Object.values(byModel).sort((a, b) => b.cost - a.cost);
    }

    function aggregateBy(days, keyFn) {
      const groups = {};
      for (const d of days) {
        const key = keyFn(d.date);
        if (!groups[key]) {
          groups[key] = { label: key, inputTokens: 0, outputTokens: 0, cacheCreationTokens: 0, cacheReadTokens: 0, totalTokens: 0, totalCost: 0, models: [] };
        }
        const g = groups[key];
        g.inputTokens += d.inputTokens;
        g.outputTokens += d.outputTokens;
        g.cacheCreationTokens += d.cacheCreationTokens;
        g.cacheReadTokens += d.cacheReadTokens;
        g.totalTokens += d.totalTokens;
        g.totalCost += d.totalCost;
        g.models = g.models.concat(d.models);
      }
      const result = Object.values(groups);
      for (const r of result) { r.models = mergeModels(r.models); }
      result.sort((a, b) => a.label.localeCompare(b.label));
      return result;
    }

    function aggregateDaily(days) {
      return days.map((d) => ({
          label: d.date,
          inputTokens: d.inputTokens,
          outputTokens: d.outputTokens,
          cacheCreationTokens: d.cacheCreationTokens,
          cacheReadTokens: d.cacheReadTokens,
          totalTokens: d.totalTokens,
          totalCost: d.totalCost,
          models: d.models.slice().sort((a, b) => b.cost - a.cost),
        }));
    }

    function aggregateWeekly(days) {
      return aggregateBy(days, (d) => getISOWeek(d));
    }

    function aggregateMonthly(days) {
      return aggregateBy(days, (d) => d.slice(0, 7));
    }

    function getAggregated(view) {
      if (view === 'weekly') return aggregateWeekly(DATA);
      if (view === 'monthly') return aggregateMonthly(DATA);
      return aggregateDaily(DATA);
    }

    // Detect theme
    function isDark() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ||
             !window.matchMedia('(prefers-color-scheme: light)').matches;
    }

    function chartColors() {
      const dark = isDark();
      return {
        text: dark ? '#8888a0' : '#666680',
        grid: dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
        tooltipBg: dark ? '#1a1a2e' : '#ffffff',
        tooltipText: dark ? '#d8d8e8' : '#1a1a2e',
        tooltipBorder: dark ? '#333350' : '#e0e0ec',
      };
    }

    // Charts
    let costChart, tokenChart, modelChart;

    function getAllModelNames(periods) {
      const set = new Set();
      for (const p of periods) {
        for (const m of p.models) set.add(m.model);
      }
      return Array.from(set).sort();
    }

    function destroyCharts() {
      if (costChart) { costChart.destroy(); costChart = null; }
      if (tokenChart) { tokenChart.destroy(); tokenChart = null; }
      if (modelChart) { modelChart.destroy(); modelChart = null; }
    }

    function baseChartOptions(colors) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: colors.tooltipBg,
            titleColor: colors.tooltipText,
            bodyColor: colors.tooltipText,
            borderColor: colors.tooltipBorder,
            borderWidth: 1,
            padding: { x: 10, y: 8 },
            titleFont: { size: 11 },
            bodyFont: { family: "'SF Mono', 'Fira Code', monospace", size: 11 },
            cornerRadius: 4,
            displayColors: false,
          },
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { color: colors.text, font: { family: "'SF Mono', monospace", size: 10 }, maxRotation: 45 },
            border: { display: false },
          },
          y: {
            grid: { color: colors.grid },
            ticks: { color: colors.text, font: { family: "'SF Mono', monospace", size: 10 } },
            border: { display: false },
          },
        },
      };
    }

    function renderCharts(periods) {
      destroyCharts();
      const colors = chartColors();
      const labels = periods.map((p) => p.label);

      // Cost chart
      const costOpts = baseChartOptions(colors);
      costOpts.scales.y.ticks.callback = (v) => `$${v}`;
      costOpts.plugins.tooltip.callbacks = { label: (ctx) => formatCostTooltip(ctx.parsed.y) };
      costChart = new Chart(document.getElementById('costChart'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            data: periods.map((p) => p.totalCost),
            backgroundColor: '#4a6fa5',
            borderRadius: 2,
            maxBarThickness: 40,
          }],
        },
        options: costOpts,
      });

      // Token chart — stacked area
      const tokenOpts = baseChartOptions(colors);
      tokenOpts.scales.y.stacked = true;
      tokenOpts.scales.x.stacked = true;
      tokenOpts.scales.y.ticks.callback = (v) => formatTokens(v);
      tokenOpts.plugins.tooltip.callbacks = { label: (ctx) => `${ctx.dataset.label}: ${formatTokens(ctx.parsed.y)}` };
      tokenOpts.plugins.legend = {
        display: true,
        position: 'top',
        align: 'end',
        labels: { color: colors.text, font: { size: 10 }, boxWidth: 10, padding: 12 },
      };
      tokenChart = new Chart(document.getElementById('tokenChart'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: 'Cache Read', data: periods.map((p) => p.cacheReadTokens), fill: true, backgroundColor: '#2c4a6e88', borderColor: '#2c4a6e', borderWidth: 1, pointRadius: 0, tension: 0.3 },
            { label: 'Cache Create', data: periods.map((p) => p.cacheCreationTokens), fill: true, backgroundColor: '#3d5a8088', borderColor: '#3d5a80', borderWidth: 1, pointRadius: 0, tension: 0.3 },
            { label: 'Output', data: periods.map((p) => p.outputTokens), fill: true, backgroundColor: '#6a8fc588', borderColor: '#6a8fc5', borderWidth: 1, pointRadius: 0, tension: 0.3 },
            { label: 'Input', data: periods.map((p) => p.inputTokens), fill: true, backgroundColor: '#4a6fa588', borderColor: '#4a6fa5', borderWidth: 1, pointRadius: 0, tension: 0.3 },
          ],
        },
        options: tokenOpts,
      });

      // Model chart — stacked bar
      const modelNames = getAllModelNames(periods);
      const modelOpts = baseChartOptions(colors);
      modelOpts.scales.y.stacked = true;
      modelOpts.scales.x.stacked = true;
      modelOpts.scales.y.ticks.callback = (v) => `$${v}`;
      modelOpts.plugins.tooltip.callbacks = { label: (ctx) => `${ctx.dataset.label}: ${formatCostTooltip(ctx.parsed.y)}` };
      modelOpts.plugins.legend = {
        display: true,
        position: 'top',
        align: 'end',
        labels: { color: colors.text, font: { size: 10 }, boxWidth: 10, padding: 12 },
      };
      modelChart = new Chart(document.getElementById('modelChart'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: modelNames.map((name, i) => ({
              label: name,
              data: periods.map((p) => {
                const found = p.models.find((m) => m.model === name);
                return found ? found.cost : 0;
              }),
              backgroundColor: MODEL_COLORS[i % MODEL_COLORS.length],
              borderRadius: 1,
              maxBarThickness: 40,
            })),
        },
        options: modelOpts,
      });
    }

    // Table
    function toggleDetail(i) {
      const rows = document.querySelectorAll(`.detail-group-${i}`);
      const chevron = document.getElementById(`chevron-${i}`);
      const isOpen = chevron.classList.contains('open');
      for (let r = 0; r < rows.length; r++) rows[r].classList.toggle('open', !isOpen);
      chevron.classList.toggle('open', !isOpen);
    }

    function renderTable(periods) {
      const container = document.getElementById('tableContainer');
      clearElement(container);

      const sorted = periods.slice().reverse();

      let totalCost = 0, totalTokens = 0;
      for (let i = 0; i < sorted.length; i++) { totalCost += sorted[i].totalCost; totalTokens += sorted[i].totalTokens; }

      const table = document.createElement('table');

      // Header
      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      const cols = [
        { text: '', cls: '' },
        { text: 'Period', cls: '' },
        { text: 'Cost', cls: 'num' },
        { text: 'Tokens', cls: 'num' },
        { text: 'Models', cls: 'num' },
      ];
      for (let ci = 0; ci < cols.length; ci++) {
        const th = document.createElement('th');
        th.textContent = cols[ci].text;
        if (cols[ci].cls) th.className = cols[ci].cls;
        hr.appendChild(th);
      }
      thead.appendChild(hr);
      table.appendChild(thead);

      // Body
      const tbody = document.createElement('tbody');
      for (let i = 0; i < sorted.length; i++) {
        const p = sorted[i];
        const tr = document.createElement('tr');
        tr.className = 'period-row';
        tr.setAttribute('data-index', String(i));
        tr.onclick = ((idx) => () => { toggleDetail(idx); })(i);

        const tdC = document.createElement('td');
        const ch = document.createElement('span');
        ch.className = 'chevron';
        ch.id = `chevron-${i}`;
        ch.textContent = '\u25B6';
        tdC.appendChild(ch);
        tr.appendChild(tdC);

        const tdP = document.createElement('td');
        tdP.className = 'period-cell';
        tdP.textContent = p.label;
        tr.appendChild(tdP);

        const tdCost = document.createElement('td');
        tdCost.className = 'num';
        tdCost.textContent = formatCostTooltip(p.totalCost);
        tr.appendChild(tdCost);

        const tdTok = document.createElement('td');
        tdTok.className = 'num';
        tdTok.textContent = formatTokens(p.totalTokens);
        tr.appendChild(tdTok);

        const tdM = document.createElement('td');
        tdM.className = 'num';
        tdM.textContent = String(p.models.length);
        tr.appendChild(tdM);

        tbody.appendChild(tr);

        // Detail rows
        for (let j = 0; j < p.models.length; j++) {
          const m = p.models[j];
          const dr = document.createElement('tr');
          dr.className = `detail-row detail-group-${i}`;

          dr.appendChild(document.createElement('td'));

          const dName = document.createElement('td');
          dName.textContent = m.model;
          dr.appendChild(dName);

          const dCost = document.createElement('td');
          dCost.className = 'num';
          dCost.textContent = formatCostTooltip(m.cost);
          dr.appendChild(dCost);

          const dTok = document.createElement('td');
          dTok.className = 'num';
          dTok.textContent = formatTokens(m.inputTokens + m.outputTokens + m.cacheCreationTokens + m.cacheReadTokens);
          dr.appendChild(dTok);

          dr.appendChild(document.createElement('td'));
          tbody.appendChild(dr);
        }
      }

      // Totals
      const totR = document.createElement('tr');
      totR.className = 'totals-row';
      totR.appendChild(document.createElement('td'));
      const tLabel = document.createElement('td');
      tLabel.textContent = 'Total';
      totR.appendChild(tLabel);
      const tCost = document.createElement('td');
      tCost.className = 'num';
      tCost.textContent = formatCostTooltip(totalCost);
      totR.appendChild(tCost);
      const tTok = document.createElement('td');
      tTok.className = 'num';
      tTok.textContent = formatTokens(totalTokens);
      totR.appendChild(tTok);
      totR.appendChild(document.createElement('td'));
      tbody.appendChild(totR);

      table.appendChild(tbody);
      container.appendChild(table);
    }

    // Stats
    function renderStats() {
      const el = document.getElementById('stats');
      clearElement(el);

      let totalCost = 0, totalTokens = 0;
      const modelCosts = {};
      for (let i = 0; i < DATA.length; i++) {
        totalCost += DATA[i].totalCost;
        totalTokens += DATA[i].totalTokens;
        for (let j = 0; j < DATA[i].models.length; j++) {
          const m = DATA[i].models[j];
          modelCosts[m.model] = (modelCosts[m.model] || 0) + m.cost;
        }
      }

      const avgDaily = DATA.length > 0 ? totalCost / DATA.length : 0;
      let topModel = '\u2014';
      let topCost = 0;
      const modelNames = Object.keys(modelCosts);
      for (let i = 0; i < modelNames.length; i++) {
        if (modelCosts[modelNames[i]] > topCost) {
          topCost = modelCosts[modelNames[i]];
          topModel = modelNames[i];
        }
      }

      const items = [
        { value: formatCostTooltip(totalCost), label: 'Total Cost' },
        { value: formatTokens(totalTokens), label: 'Total Tokens' },
        { value: formatCostTooltip(avgDaily), label: 'Avg / Day' },
        { value: topModel, label: 'Top Model' },
      ];

      for (let i = 0; i < items.length; i++) {
        const div = document.createElement('div');
        div.className = 'stat';
        const val = document.createElement('div');
        val.className = 'stat-value';
        val.textContent = items[i].value;
        const lab = document.createElement('div');
        lab.className = 'stat-label';
        lab.textContent = items[i].label;
        div.appendChild(val);
        div.appendChild(lab);
        el.appendChild(div);
      }
    }

    // Subtitle
    function renderSubtitle() {
      if (DATA.length === 0) return;
      const first = DATA[0].date;
      const last = DATA[DATA.length - 1].date;
      document.getElementById('subtitle').textContent =
        `${DATA.length} day${DATA.length !== 1 ? 's' : ''} \u00b7 ${first} \u2013 ${last}`;
    }

    // Main render
    let currentView = 'monthly';

    function renderAll() {
      if (DATA.length === 0) {
        document.getElementById('emptyState').style.display = '';
        document.getElementById('stats').style.display = 'none';
        document.querySelector('.controls').style.display = 'none';
        const sections = document.querySelectorAll('.chart-section');
        for (let i = 0; i < sections.length; i++) sections[i].style.display = 'none';
        document.getElementById('tableSection').style.display = 'none';
        return;
      }

      const periods = getAggregated(currentView);
      renderStats();
      renderSubtitle();
      renderCharts(periods);
      renderTable(periods);
    }

    // Toggle handler
    document.getElementById('granularity').addEventListener('click', function(e) {
      const btn = e.target.closest('button');
      if (!btn || !btn.dataset.view) return;
      currentView = btn.dataset.view;
      const buttons = this.querySelectorAll('button');
      for (let i = 0; i < buttons.length; i++) buttons[i].classList.toggle('active', buttons[i] === btn);
      const periods = getAggregated(currentView);
      renderCharts(periods);
      renderTable(periods);
    });

    // ---- Sessions (5-hour blocks) ----
    let sessionsRendered = false;
    let startHourChart, blockTokenChart, burnChart;

    function pad2(n) { return String(n).padStart(2, '0'); }
    function localDateKey(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }
    function blockDurationMin(b) {
      return Math.max((new Date(b.actualEndTime) - new Date(b.startTime)) / 60000, 1);
    }
    function blockBurn(b) { return b.totalTokens / blockDurationMin(b); }
    function hasOpus(b) { return b.models.some((m) => m.toLowerCase().includes('opus')); }
    function blockLabel(b) {
      const d = new Date(b.startTime);
      return `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:00`;
    }

    function destroySessionCharts() {
      if (startHourChart) { startHourChart.destroy(); startHourChart = null; }
      if (blockTokenChart) { blockTokenChart.destroy(); blockTokenChart = null; }
      if (burnChart) { burnChart.destroy(); burnChart = null; }
    }

    function renderSessionSubtitle() {
      const el = document.getElementById('sessionSubtitle');
      if (BLOCKS.length === 0) { el.textContent = ''; return; }
      const first = localDateKey(BLOCKS[0].startTime);
      const last = localDateKey(BLOCKS[BLOCKS.length - 1].startTime);
      let wk = '';
      if (WEEKS.length > 0) {
        const peakWk = WEEKS.reduce((m, w) => Math.max(m, w.totalTokens), 0);
        const cur = WEEKS[WEEKS.length - 1];
        wk = ` · peak week ${formatTokens(peakWk)} · latest week ${formatTokens(cur.totalTokens)}`;
      }
      el.textContent = `${BLOCKS.length} sessions · ${first} – ${last}${wk}`;
    }

    function renderSessionStats() {
      const el = document.getElementById('sessionStats');
      clearElement(el);
      const days = new Set(BLOCKS.map((b) => localDateKey(b.startTime)));
      const avg = days.size ? BLOCKS.length / days.size : 0;
      const peak = BLOCKS.reduce((m, b) => Math.max(m, b.totalTokens), 0);
      const hits = BLOCKS.filter((b) => b.usageLimitResetTime).length;
      const items = [
        { value: String(BLOCKS.length), label: 'Sessions' },
        { value: avg.toFixed(1), label: 'Avg / Day' },
        { value: formatTokens(peak), label: 'Peak Session' },
        { value: String(hits), label: 'Cap Hits' },
      ];
      for (let i = 0; i < items.length; i++) {
        const div = document.createElement('div');
        div.className = 'stat';
        const val = document.createElement('div');
        val.className = 'stat-value';
        val.textContent = items[i].value;
        const lab = document.createElement('div');
        lab.className = 'stat-label';
        lab.textContent = items[i].label;
        div.appendChild(val);
        div.appendChild(lab);
        el.appendChild(div);
      }
    }

    function renderSessionCharts() {
      destroySessionCharts();
      const colors = chartColors();
      const labels = BLOCKS.map(blockLabel);
      const peak = BLOCKS.reduce((m, b) => Math.max(m, b.totalTokens), 0);

      // First session of each day, bucketed by local hour
      const firstByDay = {};
      for (const b of BLOCKS) {
        const k = localDateKey(b.startTime);
        const t = new Date(b.startTime).getTime();
        if (!(k in firstByDay) || t < firstByDay[k].t) {
          firstByDay[k] = { t: t, hour: new Date(b.startTime).getHours() };
        }
      }
      const hourCounts = new Array(24).fill(0);
      for (const k in firstByDay) hourCounts[firstByDay[k].hour]++;
      const hourOpts = baseChartOptions(colors);
      hourOpts.scales.y.ticks.callback = (v) => (Number.isInteger(v) ? v : '');
      hourOpts.plugins.tooltip.callbacks = { label: (c) => `${c.parsed.y} day${c.parsed.y !== 1 ? 's' : ''}` };
      startHourChart = new Chart(document.getElementById('startHourChart'), {
        type: 'bar',
        data: {
          labels: hourCounts.map((_, h) => `${pad2(h)}:00`),
          datasets: [{ data: hourCounts, backgroundColor: '#4a6fa5', borderRadius: 2, maxBarThickness: 24 }],
        },
        options: hourOpts,
      });

      // Tokens per session, colored by whether Opus ran, with a peak reference line
      const tokOpts = baseChartOptions(colors);
      tokOpts.scales.y.ticks.callback = (v) => formatTokens(v);
      tokOpts.plugins.tooltip.callbacks = {
        label: (c) => {
          const b = BLOCKS[c.dataIndex];
          const pct = peak ? Math.round((b.totalTokens / peak) * 100) : 0;
          return `${formatTokens(b.totalTokens)} · ${pct}% of peak · ${b.models.join(', ') || '—'}`;
        },
      };
      tokOpts.plugins.legend = {
        display: true, position: 'top', align: 'end',
        labels: { color: colors.text, font: { size: 10 }, boxWidth: 10, padding: 12 },
      };
      blockTokenChart = new Chart(document.getElementById('blockTokenChart'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: 'Tokens', data: BLOCKS.map((b) => b.totalTokens), backgroundColor: BLOCKS.map((b) => (hasOpus(b) ? '#4a6fa5' : '#7da3c8')), borderRadius: 1, maxBarThickness: 18, order: 2 },
            { label: 'Peak', type: 'line', data: BLOCKS.map(() => peak), borderColor: '#8ab0d6', borderWidth: 1, borderDash: [4, 4], pointRadius: 0, fill: false, order: 1 },
          ],
        },
        options: tokOpts,
      });

      // Burn rate per session
      const burnOpts = baseChartOptions(colors);
      burnOpts.scales.y.ticks.callback = (v) => formatTokens(v);
      burnOpts.plugins.tooltip.callbacks = { label: (c) => `${formatTokens(Math.round(c.parsed.y))} tok/min` };
      burnChart = new Chart(document.getElementById('burnChart'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ data: BLOCKS.map(blockBurn), backgroundColor: '#3d5a80', borderRadius: 1, maxBarThickness: 18 }],
        },
        options: burnOpts,
      });
    }

    function renderSessionTable() {
      const container = document.getElementById('sessionTableContainer');
      clearElement(container);
      const peak = BLOCKS.reduce((m, b) => Math.max(m, b.totalTokens), 0);
      const rows = BLOCKS.slice().reverse().slice(0, 40);

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      const cols = [
        { t: 'Start (local)', c: '' }, { t: 'Dur', c: 'num' }, { t: 'Tokens', c: 'num' },
        { t: '% Peak', c: 'num' }, { t: 'Tok/min', c: 'num' }, { t: 'Models', c: '' }, { t: 'Hit', c: 'num' },
      ];
      for (const col of cols) {
        const th = document.createElement('th');
        th.textContent = col.t;
        if (col.c) th.className = col.c;
        hr.appendChild(th);
      }
      thead.appendChild(hr);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (const b of rows) {
        const tr = document.createElement('tr');
        const d = new Date(b.startTime);
        const cells = [
          { t: `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`, c: 'period-cell' },
          { t: `${Math.round(blockDurationMin(b))}m`, c: 'num' },
          { t: formatTokens(b.totalTokens), c: 'num' },
          { t: `${peak ? Math.round((b.totalTokens / peak) * 100) : 0}%`, c: 'num' },
          { t: formatTokens(Math.round(blockBurn(b))), c: 'num' },
          { t: b.models.join(', ') || '—', c: '' },
          { t: b.usageLimitResetTime ? '⚠' : '', c: 'num' },
        ];
        for (const cell of cells) {
          const td = document.createElement('td');
          td.textContent = cell.t;
          if (cell.c) td.className = cell.c;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      container.appendChild(table);
    }

    function renderSessions() {
      if (BLOCKS.length === 0) {
        document.getElementById('sessionEmpty').style.display = '';
        return;
      }
      renderSessionSubtitle();
      renderSessionStats();
      renderSessionCharts();
      renderSessionTable();
      sessionsRendered = true;
    }

    // Top-level tab switch (Usage / Sessions)
    document.getElementById('mainTabs').addEventListener('click', function(e) {
      const btn = e.target.closest('button');
      if (!btn || !btn.dataset.tab) return;
      const tab = btn.dataset.tab;
      const buttons = this.querySelectorAll('button');
      for (let i = 0; i < buttons.length; i++) buttons[i].classList.toggle('active', buttons[i] === btn);
      document.getElementById('usagePanel').style.display = tab === 'usage' ? '' : 'none';
      document.getElementById('sessionsPanel').style.display = tab === 'sessions' ? '' : 'none';
      // Charts must render while their canvas is visible, so defer sessions to first view.
      if (tab === 'sessions' && !sessionsRendered) renderSessions();
    });

    // Theme change — redraw charts
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (DATA.length > 0) renderCharts(getAggregated(currentView));
      if (sessionsRendered) renderSessionCharts();
    });

    renderAll();
  </script>
</body>
</html>
